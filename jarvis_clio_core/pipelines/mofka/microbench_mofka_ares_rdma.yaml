# Mofka Benchmark — Ares Single-Node FULL SWEEP, RDMA (ofi+verbs)
#
# 45-run producer/consumer sweep on one Ares compute node, ofi+verbs transport
# over the Mellanox 40Gbps RoCE NIC, memory partition. Paired twin of the TCP
# sweep (microbench_mofka_ares.yaml): identical sweep shape, so row-for-row
# TCP-vs-RDMA comparison is meaningful. Run the smoke variant first to confirm
# bedrock binds ofi+verbs (not a silent TCP fallback).
#
# Result (validated 2026-06-17 on ares-comp-14, ofi+verbs;ofi_rxm bound): on this
# node single-node RDMA runs COMPARABLE to / slightly above TCP — not slower.
# (The archived claude/mofka-rdma run saw RDMA 7-34% slower on a different node;
# single-node loopback RDMA can pay NIC/PCIe traversal, so a slower result is
# also plausible. Either way the numbers are logical — confirm the bound address
# contains 'verbs' to know RDMA actually engaged vs a silent TCP fallback.)
#
# Sweep: 5 data sizes x 3 thread counts x 3 repeats = 45 runs.
#
# Pattern A: one allocation, sweep runs in-process via `jarvis ppl run yaml`
# (no jarvis scheduler block — that would submit one job per iteration, which
# fails on Ares). See pipelines/mofka/architecture_decisions.md.
#
# Submit with:  sbatch jarvis_clio_core/pipelines/mofka/run_ares_mofka_rdma.sbatch
# Monitor with: squeue -u $USER     Output: mofka_bench_rdma_<jobid>.log
#
# Time budget: real per-run is ~16s (≈4s run + ~12s bedrock restart), so all 45
# finish in ~12 min (measured 2026-06-17). The sbatch's 4 h ceiling is deliberate
# over-provisioning (cold-env / verbs-init headroom), not the expected runtime.

config:
  name: mofka_bench_ares_rdma
  pkgs:
    - pkg_type: jarvis_clio_core.mofka_server
      pkg_name: mofka_srv
      protocol: "ofi+verbs"
      workdir: "/mnt/nvme/$USER/mofka-bench"
      topic: "benchmark_topic"
      partition_type: "memory"

    - pkg_type: jarvis_clio_core.mofka_bench
      pkg_name: mofka_bench
      mode: "both"
      num_events: 1000
      data_size: 1024
      metadata_size: 64
      batch_size: 16
      num_threads: 1
      data_selectivity: 1.0
      use_progress_thread: true
      nprocs: 1
      ppn: 1

vars:
  mofka_bench.data_size: [256, 1024, 4096, 16384, 65536]
  mofka_bench.num_threads: [1, 2, 4]

loop:
  - [mofka_bench.data_size]
  - [mofka_bench.num_threads]

repeat: 3

output: "${HOME}/mofka_bench_ares_rdma_results"
