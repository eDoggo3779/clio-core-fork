# Mofka Benchmark — Ares Single-Node SMOKE (Pattern A: manual sbatch, in-process sweep)
#
# Purpose: cheap end-to-end validation of the Mofka stack on a single Ares
# compute node before the full 45-run sweep. 2 iterations.
#
# Why Pattern A (no jarvis `scheduler:` block): jarvis dev runs a scheduler-block
# sweep as ONE Slurm job PER ITERATION — PipelineTest._run_single does
# `sbatch --wait` per combination against a node-local /tmp temp YAML. On Ares
# that fails twice over (compute nodes can't submit jobs; the /tmp YAML isn't
# visible across nodes). So we allocate ONCE via a .sbatch and run the whole
# sweep in-process with `jarvis ppl run yaml` — with no scheduler block,
# _run_single takes the in-process start()/stop() path. See
# pipelines/mofka/architecture_decisions.md.
#
# Submit with:  sbatch jarvis_clio_core/pipelines/mofka/run_ares_mofka_smoke.sbatch
#   (from the repo root; the .sbatch activates conda+spack, sets the hostfile,
#    clears any stale results.csv, then runs `jarvis ppl run yaml <this file>`.)
# Monitor with: squeue -u $USER     Output: mofka_smoke_<jobid>.log

config:
  name: mofka_bench_ares_smoke
  pkgs:
    - pkg_type: jarvis_clio_core.mofka_server
      pkg_name: mofka_srv
      protocol: "tcp"
      # /mnt/nvme/$USER is the per-node 250G scratch already used by CTE.
      # $USER is expanded server-side in mofka_server._configure() — do NOT
      # pre-expand here. Node-local is fine single-node (server + client
      # share the one node).
      workdir: "/mnt/nvme/$USER/mofka-bench"
      topic: "benchmark_topic"
      partition_type: "memory"

    - pkg_type: jarvis_clio_core.mofka_bench
      pkg_name: mofka_bench
      mode: "both"
      num_events: 1000
      data_size: 1024
      metadata_size: 64
      batch_size: 16
      num_threads: 1
      data_selectivity: 1.0
      use_progress_thread: true
      # Single-node: 1 host allocation → mofka_bench runs producer/consumer
      # locally (see _is_multinode). nprocs/ppn are the multi-node knobs.
      nprocs: 1
      ppn: 1

vars:
  mofka_bench.data_size: [1024, 16384]
  mofka_bench.num_threads: [1]

loop:
  - [mofka_bench.data_size]
  - [mofka_bench.num_threads]

repeat: 1

output: "${HOME}/mofka_bench_ares_smoke_results"
