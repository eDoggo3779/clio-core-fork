# =============================================================================
# S3 bdev KEEP-ALIVE SMOKE -- write path (PutObject). 2 rows, ~5 minutes.
# =============================================================================
#
# PURPOSE: prove the per-worker persistent-connection mechanism in the S3 bdev
# transport actually reuses sockets on real AWS. This is NOT a performance
# sweep and its throughput numbers are not a result -- 32 MiB per row is far
# too little to say anything about bandwidth. Run clio_s3_write.yaml for that,
# after this passes.
#
# WHAT IS BEING TESTED. `S3RestClient` used to open a fresh
# Poco::Net::HTTPClientSession per call, paying TCP+TLS on every object. It now
# takes a caller-owned `S3Connection`, and `S3BdevTransport` holds one per
# runtime worker (`conns_`, sized num_workers + ElasticHeadroom, lock-free
# exactly like FsBdevTransport::io_contexts_ because S3 ops run synchronously
# inside a worker's task body). A worker therefore connects once and reuses
# that socket for every subsequent PUT.
#
# HOW IT IS PROVEN. On Destroy the transport emits a per-worker tally to the
# runtime log at kInfo:
#
#     S3 keepalive worker=3 sockets=1 requests=32 reuses=31
#     S3 keepalive TOTAL sockets=4 requests=128 reuse_ratio=32.00
#
#   sockets  == TCP connections that worker opened
#   requests == S3 operations it sent over them
#
# So `sockets == 1` with `requests >> 1` IS connection reuse, and
# `sockets == requests` means every operation reconnected and the mechanism is
# dead. post_cmds greps the job log and FAILS THE JOB on reuse_ratio <= 1.0 --
# a green benchmark row with no reuse is a failure of this smoke, and the point
# of gating in the pipeline is that nobody has to remember to look.
#
# WHY kInfo AND NOT kDebug. HLOG compiles out everything below CTP_LOG_LEVEL,
# which defaults to kInfo (CMakeLists.txt: CLIO_CTP_LOG_LEVEL=1). A kDebug line
# is absent from every spack build, and no runtime env var brings it back. The
# tally is affordable at kInfo because it fires once per worker at teardown,
# plus one line per newly-opened socket during the run.
#
# THE GRID IS SHAPED FOR REUSE, NOT FOR BANDWIDTH.
#   row 1: K=4,  4 workers  -> ~32 requests per socket. Deep reuse; this is
#          the row that fails loudly if sessions are not being kept.
#   row 2: K=16, 16 workers -> ~8 requests per socket across many workers.
#          This is the row that fails if workers are sharing one session
#          (sockets would collapse toward 1 with corrupted/interleaved
#          responses) or if slot indexing is wrong (sockets >> workers).
# Objects are 256 KiB so a row is bounded by round trips, not by the ~11 MB/s
# uplink -- the whole point is to issue many small operations quickly.
#
# NO ZARR AND NO RAWPUT COMPARATOR. Nothing here is being compared to anything;
# they would triple the runtime to produce numbers this smoke must not report.
# botocore is still needed (preflight, purge, object count), so ZARR_VENV is
# still required.
#
# Usage:
#   export S3_BENCH_BUCKET=my-bucket S3_BENCH_PROFILE=clio-bench
#   export S3_BENCH_REGION=us-east-2      # MANDATORY, the bucket's real region
#   export IOWARP_VIEW=/mnt/common/$USER/iowarp-s3-view ZARR_VENV=$HOME/zarr-venv
#   export PATH="$HOME/jarvis-venv/bin:$PATH"
#   jarvis ppl submit <abs path>/clio_s3_write_smoke.yaml
#
# Output: ${HOME}/clio_s3_ka_smoke_results/results.csv (2 rows) and, in the job
#         log, the `S3 keepalive` tallies that are the actual deliverable.

scheduler:
  name: slurm
  job_name: clio_s3_ka_smoke_w
  nodes: 1
  ntasks_per_node: 1
  # 40, NOT MORE. Ares compute nodes have 40 allocatable CPUs and sbatch
  # rejects the job outright above that, before anything runs.
  cpus_per_task: 40
  partition: compute
  # Two rows of 32 MiB. 30 minutes is already generous; if this job runs long
  # something is wedged, and a short walltime surfaces that instead of burning
  # an allocation.
  time: "00:30:00"
  output: ${HOME}/clio_s3_ka_smoke_w-%j.out
  error: ${HOME}/clio_s3_ka_smoke_w-%j.err
  # MUST stay literally identical to config.hostfile below.
  hostfile: "${HOME}/.jarvis-s3-bench/clio_s3_ka_smoke_w_hostfile.txt"
  pre_cmds:
    # 1) Toolchain. Pure PATH prepends -- never `spack load` / `conda activate`
    #    (they install shell functions that misbehave under `set -euo pipefail`).
    - 'export PATH="${IOWARP_VIEW:-/mnt/common/$USER/iowarp-s3-view}/bin:${JARVIS_VENV:-$HOME/jarvis-venv}/bin:$PATH"'
    - 'export LD_LIBRARY_PATH="${IOWARP_VIEW:-/mnt/common/$USER/iowarp-s3-view}/lib:${IOWARP_VIEW:-/mnt/common/$USER/iowarp-s3-view}/lib64:${LD_LIBRARY_PATH:-}"'
    - 'command -v clio_run            >/dev/null 2>&1 || { echo "ERROR: clio_run not on PATH (view: ${IOWARP_VIEW:-/mnt/common/$USER/iowarp-s3-view})" >&2; exit 1; }'
    - 'command -v clio_s3_write_bench >/dev/null 2>&1 || { echo "ERROR: clio_s3_write_bench not on PATH — was IOWarp built with +s3_bdev?" >&2; exit 1; }'
    - 'command -v jarvis              >/dev/null 2>&1 || { echo "ERROR: jarvis not on PATH (venv: ${JARVIS_VENV:-$HOME/jarvis-venv})" >&2; exit 1; }'
    - '"${ZARR_VENV:-$HOME/zarr-venv}/bin/python3" -c "import botocore" || { echo "ERROR: botocore missing from ${ZARR_VENV:-$HOME/zarr-venv} (needed for preflight/purge/count)" >&2; exit 1; }'
    # Every IOWarp binary must come from ONE install root. A stale view earlier
    # on PATH silently pairs an OLD clio_run with a NEW bench.
    - |
      RUN_ROOT="$(dirname "$(dirname "$(readlink -f "$(command -v clio_run)")")")"
      BENCH_ROOT="$(dirname "$(dirname "$(readlink -f "$(command -v clio_s3_write_bench)")")")"
      if [ "$RUN_ROOT" != "$BENCH_ROOT" ]; then
        echo "ERROR: mixed IOWarp installs on PATH -- these must be one prefix" >&2
        echo "  clio_run            -> $RUN_ROOT" >&2
        echo "  clio_s3_write_bench -> $BENCH_ROOT" >&2
        exit 1
      fi
      echo "install root OK: $RUN_ROOT"
    # THE GATE THAT MATTERS FOR THIS SMOKE. The keep-alive code lives in
    # libclio_bdev_runtime.so, not in the benchmark binary, so the bench build
    # stamp the sweep checks says nothing about it. `spack develop` rebuilds in
    # place and branch versions do not rehash, so a `git pull` without a `spack
    # install` leaves a library that predates the change with the same spec
    # name, the same hash and the same view. The tally format string is a
    # compiled-in literal that only exists in a build carrying this work --
    # grep the library for it directly. Without this gate the smoke would run
    # green against the OLD session-per-call transport and simply print no
    # tallies, which reads as "the grep found nothing" rather than "you are
    # testing the wrong build".
    #
    # It also doubles as a compile-level check: if someone lowers this log line
    # back to kDebug, CTP_LOG_LEVEL=1 compiles it out, the literal disappears,
    # and this gate fires.
    - |
      LIB="$(command -v clio_run)"; LIB="${LIB%/bin/clio_run}/lib/libclio_bdev_runtime.so"
      [ -f "$LIB" ] || LIB="${LIB%/lib/*}/lib64/libclio_bdev_runtime.so"
      [ -f "$LIB" ] || { echo "ERROR: libclio_bdev_runtime.so not found under the install root" >&2; exit 1; }
      ldd "$LIB" 2>/dev/null | grep -q PocoNetSSL || { echo "ERROR: $LIB has no Poco NetSSL — built without +s3_bdev?" >&2; exit 1; }
      ldd "$LIB" 2>/dev/null | grep -q aws-cpp-sdk && { echo "ERROR: $LIB links the AWS SDK — that stack-smashes runtime init" >&2; exit 1; }
      strings "$LIB" 2>/dev/null | grep -qF "S3 keepalive worker=" || {
        echo "ERROR: $LIB PREDATES the persistent-connection change (no 'S3 keepalive' tally)." >&2
        echo "  This smoke would pass meaninglessly against it. Pulling the repo" >&2
        echo "  does NOT rebuild a spack-develop install:" >&2
        echo "    spack install iowarp@968-s3-bench" >&2
        echo "  or, for a non-develop spec (branch versions do not rehash):" >&2
        echo "    spack uninstall -y iowarp@968-s3-bench && spack clean -s \\" >&2
        echo "      && spack install iowarp@968-s3-bench +cae +cte +s3 +s3_bdev" >&2
        exit 1; }
      echo "keepalive build gate OK: $LIB carries the S3 keepalive tally"
    # 2) AWS credentials. NO SECRETS IN THIS FILE -- only profile/region names.
    #    The process that signs is the clio_run daemon, whose Poco SigV4 signer
    #    reads RAW ENV VARS ONLY (no AWS_PROFILE support), so the profile must
    #    be resolved to keys here and forwarded via the runtime's forward_env.
    - 'export AWS_PROFILE="${S3_BENCH_PROFILE:-clio-bench}"'
    - '[ -n "${S3_BENCH_REGION:-}" ] || { echo "ERROR: S3_BENCH_REGION not set -- it must be the real region of the bucket" >&2; exit 1; }'
    - 'export AWS_DEFAULT_REGION="$S3_BENCH_REGION"'
    # Real AWS: an endpoint override flips the signer to path-style addressing
    # against a nonexistent host, so both must stay unset.
    - 'unset S3_ENDPOINT AWS_ENDPOINT_URL'
    - '[ -r "$HOME/.aws/credentials" ] || { echo "ERROR: ~/.aws/credentials missing/unreadable" >&2; exit 1; }'
    - '[ -n "${S3_BENCH_BUCKET:-}" ] || { echo "ERROR: S3_BENCH_BUCKET not set" >&2; exit 1; }'
    - |
      eval "$(python3 - "$AWS_PROFILE" <<'PY'
      import configparser, os, shlex, sys
      profile = sys.argv[1]
      cfg = configparser.ConfigParser()
      cfg.read(os.path.expanduser("~/.aws/credentials"))
      if profile not in cfg:
          # stdout is eval'd by the shell, so diagnostics must go to stderr.
          sys.exit(f"no profile [{profile}] in ~/.aws/credentials")
      sec = cfg[profile]
      for env, key in (("AWS_ACCESS_KEY_ID", "aws_access_key_id"),
                       ("AWS_SECRET_ACCESS_KEY", "aws_secret_access_key"),
                       ("AWS_SESSION_TOKEN", "aws_session_token")):
          if sec.get(key):
              print(f"export {env}={shlex.quote(sec[key])}")
      PY
      )"
    - '[ -n "${AWS_ACCESS_KEY_ID:-}" ] || { echo "ERROR: AWS_ACCESS_KEY_ID empty after reading profile [$AWS_PROFILE] — the runtime cannot sign without it" >&2; exit 1; }'
    - 'echo "credentials exported from [$AWS_PROFILE], region $AWS_DEFAULT_REGION"'
    # 3) Stale-state cleanup. pkill patterns are BRACKETED so they never match
    #    this script's own argv. Only chi_* is removed from /dev/shm: it is
    #    shared with other users, so a blanket sweep would destroy their state.
    - 'pkill -9 -f "[c]himaera" 2>/dev/null || true'
    - 'pkill -9 -f "[c]lio_run" 2>/dev/null || true'
    - '{ command -v fuser >/dev/null 2>&1 && fuser -k 9413/tcp; } >/dev/null 2>&1 || true'
    - 'rm -f /dev/shm/chi_* 2>/dev/null || true'
    - 'rm -rf /tmp/iowarp_chi* 2>/dev/null || true'
    # 4) Experiment dirs + repo registration + clean slate (the sweep runner
    #    RESUMES over an existing results.csv and would skip failed rows).
    - 'mkdir -p "$HOME/clio_s3_ka_smoke_results" "$HOME/.jarvis-s3-bench"'
    # The runtime persists a perf model here and logs an ERROR per attempt if
    # it cannot. /tmp is node-local, so this must happen on the compute node.
    - 'mkdir -p /tmp/clio/models 2>/dev/null || echo "note: /tmp/clio/models not creatable; TaskStatModel will log errors (harmless)"'
    - |
      if [ -z "${CLIO_REPO:-}" ]; then
        for cand in "$HOME/clio-core-fork" "$HOME/clio-core"; do
          if [ -d "$cand/jarvis_clio_core/jarvis_clio_core" ]; then CLIO_REPO="$cand"; break; fi
        done
      fi
      [ -n "${CLIO_REPO:-}" ] || { echo "ERROR: no CLIO checkout found; set CLIO_REPO" >&2; exit 1; }
      export CLIO_REPO
      RT_PKG="$CLIO_REPO/jarvis_clio_core/jarvis_clio_core/clio_runtime/pkg.py"
      [ -f "$RT_PKG" ] || { echo "ERROR: $RT_PKG missing -- CLIO_REPO=$CLIO_REPO is wrong" >&2; exit 1; }
      grep -q "forward_env" "$RT_PKG" || {
        echo "ERROR: $RT_PKG has no forward_env option, so AWS credentials" >&2
        echo "  cannot reach the clio_run daemon and every PutBlob will fail." >&2
        exit 1; }
      for shadow in "$HOME/.ppi-jarvis/builtin/clio_runtime" \
                    "$HOME/.ppi-jarvis/builtin/clio_s3_bench"; do
        if [ -e "$shadow" ]; then
          echo "ERROR: $shadow shadows the checkout; jarvis will load the stale copy. Remove it." >&2
          exit 1
        fi
      done
      jarvis repo add "$CLIO_REPO/jarvis_clio_core" 2>/dev/null || true
      echo "jarvis packages OK: $CLIO_REPO/jarvis_clio_core"
    - 'rm -f "$HOME/clio_s3_ka_smoke_results/results.csv"'
    # Pre-flight the EXACT call the S3 bdev makes at Init: a HEAD on the bucket
    # signed with the RAW EXPORTED KEYS, plus an authoritative region check.
    # botocore transparently follows S3 region redirects and would report
    # success on a wrong region; the bdev's hand-rolled signer has no redirect
    # logic, so a HEAD-only preflight can go green while every PUT gets a 301.
    - |
      "${ZARR_VENV:-$HOME/zarr-venv}/bin/python3" - <<'EOF' || exit 1
      import os, sys
      import botocore.session, botocore.exceptions
      key    = os.environ.get("AWS_ACCESS_KEY_ID", "")
      secret = os.environ.get("AWS_SECRET_ACCESS_KEY", "")
      token  = os.environ.get("AWS_SESSION_TOKEN") or None
      region = os.environ.get("AWS_DEFAULT_REGION", "")
      bucket = os.environ.get("S3_BENCH_BUCKET", "")
      if not key or not secret:
          sys.exit("ERROR: AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY are empty "
                   "after the credential export. The S3 bdev needs raw keys.")
      client = botocore.session.get_session().create_client(
          "s3", region_name=region, aws_access_key_id=key,
          aws_secret_access_key=secret, aws_session_token=token)
      try:
          client.head_bucket(Bucket=bucket)
      except botocore.exceptions.ClientError as e:
          code = e.response.get("ResponseMetadata", {}).get("HTTPStatusCode")
          sys.exit(f"ERROR: HeadBucket on '{bucket}' failed with HTTP {code}: {e}\n"
                   f"  403 -> the key pair needs s3:ListBucket on the bucket itself\n"
                   f"  301 -> AWS_DEFAULT_REGION={region} is not the region of the bucket\n"
                   f"  404 -> bucket name is wrong")
      try:
          loc = client.get_bucket_location(Bucket=bucket).get("LocationConstraint")
      except botocore.exceptions.ClientError as e:
          sys.exit(f"ERROR: GetBucketLocation on '{bucket}' failed: {e}")
      true_region = {None: "us-east-1", "": "us-east-1",
                     "EU": "eu-west-1"}.get(loc, loc)
      if true_region != region:
          sys.exit(f"ERROR: S3_BENCH_REGION={region} but bucket '{bucket}' "
                   f"lives in {true_region}.\n"
                   f"  Fix: export S3_BENCH_REGION={true_region}")
      print(f"S3 preflight OK: HeadBucket {bucket}, region confirmed {true_region}")
      EOF
  post_cmds:
    - 'RES="$HOME/clio_s3_ka_smoke_results/results.csv"; n=$(grep -c success "$RES" 2>/dev/null || true); n=${n:-0}; echo "successful rows: $n / 2"'
    # THE GATE. Everything above only proves the benchmark ran; this is what
    # proves the mechanism worked. The transport logs its per-worker tally at
    # kInfo, HLOG writes every level to stderr, and the daemon is launched
    # exec_async with inherited fds -- so the tallies land in this job's Slurm
    # log. Both .out and .err are scanned because which one carries it depends
    # on how jarvis wired the daemon's stdio, and that is not worth depending on.
    #
    # EXITS NONZERO on no reuse. A smoke that prints "reuse_ratio 1.00" and
    # still reports success would be worse than no smoke at all.
    - |
      python3 - <<'EOF'
      import glob, os, re, sys
      job = os.environ.get("SLURM_JOB_ID", "*")
      home = os.path.expanduser("~")
      logs = (glob.glob(f"{home}/clio_s3_ka_smoke_w-{job}.out")
              + glob.glob(f"{home}/clio_s3_ka_smoke_w-{job}.err"))
      text = ""
      for p in logs:
          try:
              with open(p, errors="replace") as f:
                  text += f.read()
          except OSError as e:
              print(f"note: could not read {p}: {e}")
      if not logs:
          sys.exit("FAIL: no job log found to scan for keepalive tallies")

      per_worker = re.findall(
          r"S3 keepalive worker=(\d+) sockets=(\d+) requests=(\d+) reuses=(\d+)",
          text)
      totals = re.findall(
          r"S3 keepalive TOTAL sockets=(\d+) requests=(\d+) reuse_ratio=([\d.]+)",
          text)

      if not per_worker:
          sys.exit(
              "FAIL: no 'S3 keepalive' tally in the job log.\n"
              "  Either no S3 I/O happened (check the rows above), or the\n"
              "  installed libclio_bdev_runtime.so predates this change --\n"
              "  though the pre_cmds build gate should have caught that.")

      print(f"keepalive tallies found: {len(per_worker)} worker line(s), "
            f"{len(totals)} total line(s)")
      worst = None
      for wid, sockets, requests, reuses in per_worker:
          s, r = int(sockets), int(requests)
          ratio = r / s if s else 0.0
          print(f"  worker={wid} sockets={s} requests={r} "
                f"reuses={reuses} ratio={ratio:.2f}")
          if worst is None or ratio < worst:
              worst = ratio

      bad = []
      for sockets, requests, ratio in totals:
          if float(ratio) <= 1.0:
              bad.append((sockets, requests, ratio))
      print("\nTOTAL lines:", totals or "none")

      if bad:
          sys.exit(
              f"FAIL: {len(bad)} run(s) reported reuse_ratio <= 1.00 -- every\n"
              "  S3 operation opened its own socket, so persistent connections\n"
              "  are NOT in effect even though the rows are green.")
      if worst is not None and worst <= 1.0:
          sys.exit(f"FAIL: a worker reused nothing (worst ratio {worst:.2f})")
      print("\nPASS: sockets are being reused across S3 operations "
            f"(worst per-worker ratio {worst:.2f})")
      EOF
    # Purge the smoke prefix. Never fails the job: a purge problem must not
    # retroactively fail a smoke that already proved what it set out to.
    - |
      "${ZARR_VENV:-$HOME/zarr-venv}/bin/python3" - <<'EOF' || echo "purge skipped (non-fatal)"
      import os, sys
      import botocore.session
      bucket = os.environ.get("S3_BENCH_BUCKET")
      if not bucket:
          print("S3_BENCH_BUCKET unset; nothing to purge"); sys.exit(0)
      prefix = "clio-s3-ka-smoke/"
      c = botocore.session.get_session().create_client(
          "s3", region_name=os.environ.get("AWS_DEFAULT_REGION"))
      keys = []
      for page in c.get_paginator("list_objects_v2").paginate(
              Bucket=bucket, Prefix=prefix):
          for o in page.get("Contents", []):
              keys.append({"Key": o["Key"]})
      n = 0
      for i in range(0, len(keys), 1000):
          r = c.delete_objects(Bucket=bucket,
                               Delete={"Objects": keys[i:i + 1000]})
          n += len(r.get("Deleted", []))
      print(f"purged {n} object(s) under s3://{bucket}/{prefix}")
      EOF

config:
  name: clio_s3_ka_smoke_w

  # MUST stay literally identical to scheduler.hostfile above.
  hostfile: "${HOME}/.jarvis-s3-bench/clio_s3_ka_smoke_w_hostfile.txt"

  pkgs:
    - pkg_type: jarvis_clio_core.clio_runtime
      pkg_name: runtime
      num_threads: 4           # SWEPT with concurrency
      client_data_segment_size: "4G"
      port: 9413
      # IPC (unix socket), NOT shm: the benchmark is a detached client, not a
      # descendant of the runtime daemon, and Ares compute nodes run
      # ptrace_scope=1, which denies the /proc reopen SHM mode needs
      # (shm_open -> EACCES, "Failed to initialize Clio").
      ipc_mode: "ipc"
      # info, NOT debug. The keepalive tally is deliberately logged at kInfo so
      # it survives a release build; debug would add nothing here and would
      # bury the tallies the post_cmds gate has to find.
      log_level: "info"
      # SWIM off: transient errors must not promote a peer to dead mid-run.
      swim_enabled: false
      sleep: 4
      # THE DAEMON DOES NOT INHERIT THE JOB SCRIPT'S ENVIRONMENT -- jarvis
      # builds it from EnvironmentManager.COMMON_ENV_VARS, which has no AWS_*
      # entry. The SigV4 signer runs inside a runtime worker and reads raw keys
      # from the environment only. Names only; values never appear in a log.
      forward_env:
        - AWS_ACCESS_KEY_ID
        - AWS_SECRET_ACCESS_KEY
        - AWS_SESSION_TOKEN      # optional; skipped when unset
        - AWS_DEFAULT_REGION

    - pkg_type: jarvis_clio_core.clio_cte
      pkg_name: cte_core
      # EXACTLY ONE device, and it is the S3 tier. Load-bearing: with any local
      # tier present the DPE may place blobs there and the smoke would prove
      # nothing about S3 connections at all.
      #
      # The KEY PREFIX IS MANDATORY -- CTE registers targets as <path>_node<N>,
      # so a bare "s3://bucket" would append the node suffix to the BUCKET NAME.
      devices:
        - ["s3://${S3_BENCH_BUCKET}/clio-s3-ka-smoke/bdev", "8GB", 1.0]
      dpe_type: "max_bw"
      neighborhood: 1
      pool_query: "local"

    - pkg_type: jarvis_clio_core.clio_s3_bench
      pkg_name: clio_s3
      mode: write
      # 256 KiB x 128 = 32 MiB per row. Small on purpose: this smoke is bounded
      # by round trips, not bandwidth, and many small operations are exactly
      # what makes socket reuse visible. Do not read throughput off this.
      object_size: "256k"
      num_objects: 128
      concurrency: 4                                  # SWEPT
      worker_threads: 4                               # SWEPT (reported only)
      bucket: "${S3_BENCH_BUCKET}"
      key_prefix: "clio-s3-ka-smoke/bdev"
      purge_prefix: true
      venv: "${ZARR_VENV}"
      tag_prefix: "s3kaw"
      aws_region: "${S3_BENCH_REGION}"
      aws_profile: "${S3_BENCH_PROFILE}"
      # OFF here -- this file is the PUT-path smoke. clio_s3_read_smoke.yaml
      # turns it on to exercise GetObject on the same connections.
      verify: false

vars:
  # Concurrency is the only axis. runtime.num_threads is zipped to it because
  # each S3 PUT blocks a whole runtime worker inside WriteBlocks, so a pool
  # narrower than K caps concurrency below the requested value -- and, for this
  # smoke specifically, changes how many sockets should exist.
  #
  # Row 1 (K=4) is the deep-reuse row: ~32 requests per socket.
  # Row 2 (K=16) is the isolation row: reuse must still hold with many workers
  # active at once, and sockets must scale with workers rather than collapsing
  # to one (shared session) or exploding (broken slot indexing).
  clio_s3.concurrency:    [4, 16]
  runtime.num_threads:    [4, 16]
  clio_s3.worker_threads: [4, 16]

loop:
  - [clio_s3.concurrency, runtime.num_threads, clio_s3.worker_threads]

# Per-combination wall-clock backstop. 32 MiB should take seconds; 300 s means
# something is hung, and expiry marks the row failed and continues.
run_timeout: 300

# No repeats. This proves a mechanism, not a measurement -- there is no
# variance to average out.
repeat: 1
output: "${HOME}/clio_s3_ka_smoke_results"
