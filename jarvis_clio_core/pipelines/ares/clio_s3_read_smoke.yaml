# =============================================================================
# Issue #968 — CLIO S3 READ failure-REPRODUCTION smoke, revision 2.
# =============================================================================
#
# This is NOT a benchmark. It produces no comparison and no headline number.
# Its only job is to explain the sporadic read failure.
#
# ---------------------------------------------------------------------------
# WHAT REVISION 1 SETTLED (job 24154, 24 rows; plus 23925/23930/24155)
# ---------------------------------------------------------------------------
# The failure is still localised to ONE cell. Cumulative over four jobs:
#
#     cell            runs   failures
#     4m   / 512        39       5      <-- 12.8%
#     everything else   93       0
#
# Three candidate mechanisms were RULED OUT by direct evidence, not argument:
#
#   * "the response archive was missing"  -- REFUTED. The kError added for that
#     case fired 0 times in 270k lines, and the failing row reported task_rc=0
#     rather than the sentinel that path returns. RecvOut found an archive.
#   * "the ZMQ send retry duplicated a response" -- REFUTED. `re-queueing` = 0
#     and every [CountSend] line reported `fails so far = 0`.
#   * "a rescue ran the object twice" -- REFUTED. obj_000204 appears exactly
#     once per row across all 15 rows that touch it.
#
# What survived is sharper: `Processing context 1/1` = 512 and `Successfully
# scheduled 1` = 512 for the failing row, so EVERY object including the failed
# one completed successfully inside the runtime. The client nevertheless read
# scheduled=0. So the archive the client deserialized was well-formed but
# carried the runtime's PRE-COMPLETION defaults -- it was serialized before the
# handler's coroutine reached the line that fills the OUT fields in. The
# object's real completion then produced two further responses, which arrived
# with nothing waiting for them ([CountClientRecv] responses=516 misses=2, both
# misses naming the same net_key).
#
# The environmental anomaly that co-occurs: stall_threshold_sec was 1.0, which
# a 4 MiB S3 GET exceeds routinely, so that row logged 56,426 stall detections
# and 46,576 rescues -- 83.7% of which moved no task at all. That is not proof.
# Rescues fired ~6113 times in the runtime that failed once, so rescue is at
# most NECESSARY, never sufficient, and nothing in the logs isolated which one
# mattered. Revision 2 exists to close that gap by experiment instead.
#
# ---------------------------------------------------------------------------
# WHAT IS DIFFERENT ABOUT REVISION 2
# ---------------------------------------------------------------------------
# 1. THE READOUT IS NO LONGER PASS/FAIL. Revision 1 had to wait for a whole row
#    to go red -- a ~12% per-row event, which no affordable allocation can make
#    statistically meaningful. The runtime now counts the underlying EVENTS
#    directly, each of which can fire many times in a row that still passes:
#
#      [#968] PREMATURE RESPONSE ...... a reply serialized for a task whose
#                                       coroutine had NOT completed. Direct test
#                                       of the surviving hypothesis: if it never
#                                       fires, that hypothesis is dead.
#      [#968] DUPLICATE RESPONSE ...... a second reply for one request.
#      [#968] RESPONSE IDENTITY
#             MISMATCH ................ a reply that matched a net_key but
#                                       named a DIFFERENT task. Responses are
#                                       demuxed by the waiting task's heap
#                                       address, which is recycled the moment
#                                       that task is freed; the daemon now
#                                       echoes the client's own task identity
#                                       so the address match can be checked
#                                       against something that is never reused.
#
#    READ THE LINES, NOT JUST THE COUNTS. PREMATURE RESPONSE is true by
#    construction for two BENIGN paths that also complete a task without running
#    its coroutine to the end: the early access-control rejection in
#    Worker::ExecTask (which ships rc=EACCES=13) and the batch-merge broadcast in
#    CompleteBatchParents / batch_manager.cc (a different pool and method). The
#    #968 signature is specifically rc=0 on the CAE pool's ParseOmni method --
#    the log line carries pool, method, rc and worker precisely so the three can
#    be told apart. DUPLICATE RESPONSE and IDENTITY MISMATCH have no benign path
#    and a single occurrence of either is a result on its own.
#
#    Read the per-row table post_cmds prints and the matching lines in the
#    evidence file, not the success column.
#
# 2. IT IS A CONTROLLED A/B ON THE RESCUE MACHINERY. runtime.stall_threshold_sec
#    is now configurable, and every configuration below runs TWICE:
#
#      arm LIVE  (1.0 s)    rescue behaves exactly as it did in jobs 23925
#                           through 24155 -- the control, bit-identical to the
#                           condition that produced all five failures.
#      arm INERT (3600 s)   no task can plausibly exceed an hour, so stall
#                           detection never fires and the rescue path never
#                           runs. Same build, same everything else.
#
#    The arms alternate (combo 0 = LIVE, 1 = INERT, 2 = LIVE, ...) so the run
#    yields complete PAIRS even if the allocation is cut short, and so that
#    slow drift in S3 throughput hits both arms equally instead of loading onto
#    whichever ran second.
#
#    Anomalies in LIVE and none in INERT implicates rescue. Anomalies in BOTH
#    exonerates it and moves the investigation to ordinary completion ordering.
#    Either is a result; "no anomalies anywhere" says the instrumentation is
#    looking in the wrong place, which is also worth knowing in one hour.
#
# 3. THE STRESS TAIL IS GONE. 256m/8 and 32m/64 have now produced 0 failures in
#    93 rows across four jobs and are link-bound at ~11 MB/s, so they carry no
#    signal and cost ~21 minutes a block. 512k/4096 stays, for a reason that
#    has nothing to do with its own failure rate: at 4096 objects it is 8x the
#    client/daemon round trips of any other cell per unit time, which makes it
#    the most sensitive cell in the grid for the new per-event counters even
#    though its rows always pass.
#
# 4. verify NOW RUNS ON FAILED ROWS. Revision 1 gated VerifyTags behind
#    `exit_code == 0`, so the one measurement built to separate "the bytes
#    landed and only the reply was lost" from "the transfer really failed" was
#    skipped on precisely the rows that needed it. Fixed in the bench; the row
#    exit code is unchanged, only evidence is added.
#
# 5. THE LOGS ARE QUIETER AND MORE INFORMATIVE. Revision 1's job wrote 270,704
#    lines to .err, of which 56,426 were one worker repeating that it was still
#    stalled and 38,983 were rescues that moved nothing. Both are now
#    deduplicated (once per stall EPISODE; no-op rescues at kDebug) and the
#    periodic scheduler telemetry moved from kWarning to kInfo, so a kWarning in
#    this job's log is again something that deserves attention.
#
# 6. strict_response_identity IS FALSE. A mismatched response is logged loudly
#    and still DELIVERED, so this job's behaviour is identical to the runs it is
#    being compared against. Setting it true makes the runtime reject such a
#    response and keep waiting -- that is the candidate FIX, and it should be
#    measured only after this job establishes that mismatches occur at all.
#
# ---------------------------------------------------------------------------
# SHAPE AND BUDGET (CLIO-only wall time per row, from the 72 measured rows)
# ---------------------------------------------------------------------------
#   per arm:  4m/512   K=1 384 s + K=8 277 s + K=32 234 s   = 895 s
#             ...the same three again (block 2)             = 895 s
#             4m/128   K=32                                 =  59 s
#             512k/4096 K=32                                = 386 s
#                                                      arm  = 2235 s
#   two arms 4470 s + 16 runtime start/stop cycles (~35 s)  =  560 s
#                                                     TOTAL ~ 5030 s = 1 h 24 m
#   time: 03:00:00 leaves ~2.1x. The INERT arm may run slower than the LIVE one
#   -- suppressing rescue also suppresses the backlog redistribution that
#   relieves head-of-line blocking -- so do not trim this on the assumption
#   that the arms cost the same.
#
# CAVEAT ON LOGS: clio_runtime's clean() deletes {shared_dir}/clio_run.log at
# teardown (clio_runtime/pkg.py:547), so the per-row daemon log does NOT survive
# the row. The durable record is the scheduler .out/.err pair, which is what
# post_cmds reads. Each row's daemon prints "[#968] stall threshold = Xs" once
# at startup, and post_cmds uses that line to split the combined log back into
# per-row segments -- that is how the per-row anomaly table below is built, so
# do not remove that log line.
#
# RUN IT ALONE. Revision 1 was submitted alongside the full sweep on a separate
# node, and I asserted they would not interfere on the strength of node, CPU,
# port, hostfile and tmpdir isolation. They shared the S3 uplink, both jobs ran
# measurably slower than their historical baselines, and the sweep's clean
# result is correspondingly weaker evidence than it looks. Check
# `squeue -u $USER` and wait for it to be empty of this family.
#
# Usage:
#   export S3_BENCH_BUCKET=my-bucket S3_BENCH_PROFILE=clio-bench
#   export IOWARP_VIEW=/mnt/common/$USER/iowarp-s3-view
#   jarvis ppl submit <abs path>/clio_s3_read_smoke.yaml
#
#   pre_cmds expand when the JOB runs, so export any overrides BEFORE submitting.
#
scheduler:
  name: slurm
  job_name: clio_s3_smoke
  nodes: 1
  ntasks_per_node: 1
  # Must stay large: Ares Slurm uses proctrack/cgroup with ConstrainCores, and
  # a narrow cgroup silently caps the runtime's effective worker count, which
  # would change the very concurrency behaviour we are trying to reproduce.
  cpus_per_task: 40
  partition: compute
  time: "03:00:00"
  output: ${HOME}/clio_s3_smoke-%j.out
  error: ${HOME}/clio_s3_smoke-%j.err
  # MUST stay literally identical to config.hostfile below.
  hostfile: "${HOME}/.jarvis-s3-bench/clio_s3_smoke_hostfile.txt"
  pre_cmds:
    # 1) Toolchain. Pure PATH prepends -- never `spack load` / `conda activate`
    #    (they install shell functions that misbehave under `set -euo pipefail`).
    - 'export PATH="${IOWARP_VIEW:-/mnt/common/$USER/iowarp-s3-view}/bin:${JARVIS_VENV:-$HOME/jarvis-venv}/bin:$PATH"'
    - 'export LD_LIBRARY_PATH="${IOWARP_VIEW:-/mnt/common/$USER/iowarp-s3-view}/lib:${IOWARP_VIEW:-/mnt/common/$USER/iowarp-s3-view}/lib64:${LD_LIBRARY_PATH:-}"'
    - 'command -v clio_run           >/dev/null 2>&1 || { echo "ERROR: clio_run not on PATH (view: ${IOWARP_VIEW:-/mnt/common/$USER/iowarp-s3-view})" >&2; exit 1; }'
    - 'command -v clio_s3_read_bench >/dev/null 2>&1 || { echo "ERROR: clio_s3_read_bench not on PATH — was IOWarp built with +cae +s3_cae?" >&2; exit 1; }'
    - 'command -v jarvis             >/dev/null 2>&1 || { echo "ERROR: jarvis not on PATH (venv: ${JARVIS_VENV:-$HOME/jarvis-venv})" >&2; exit 1; }'
    - 'echo "toolchain: clio_run=$(command -v clio_run) bench=$(command -v clio_s3_read_bench) jarvis=$(command -v jarvis)"'
    # NOTE: no zarr venv check and no cae_s3_tool check -- this pipeline runs
    # neither comparator. Keep it that way; adding them back would re-import
    # 2/3 of the wall time this smoke exists to spend on repetitions instead.
    # 1b) CAE runtime link gate. Assert the installed library is the in-process
    #     (Poco+SigV4, no AWS SDK) build, and that it post-dates the port -- a
    #     `spack develop` tree does NOT rebuild on `git pull`, so run
    #     `spack install iowarp@dev` after every pull or this smoke measures a
    #     stale binary and every conclusion from it is void.
    - |
      echo "cae gate: host=$(hostname -s) time=$(date -Is)"
      CLIO_RUN_BIN="$(command -v clio_run || true)"
      LIB="${CLIO_RUN_BIN%/bin/clio_run}/lib/libclio_cae_core_runtime.so"
      [ -f "$LIB" ] || LIB="${LIB%/lib/*}/lib64/libclio_cae_core_runtime.so"
      [ -f "$LIB" ] || { echo "ERROR: libclio_cae_core_runtime.so not found under the install root" >&2; exit 1; }
      echo "cae gate: lib -> $(readlink -f "$LIB" 2>&1 || true)"
      LDD_OUT="$(ldd "$LIB" 2>&1)" || { echo "ERROR: ldd failed on $LIB:" >&2; printf '%s\n' "$LDD_OUT" >&2; exit 1; }
      printf '%s\n' "$LDD_OUT" | grep -q PocoNetSSL || { echo "ERROR: $LIB has no Poco NetSSL — CAE built without the in-process S3 path?" >&2; exit 1; }
      printf '%s\n' "$LDD_OUT" | grep -q aws-cpp-sdk && { echo "ERROR: $LIB links the AWS SDK — that stack-smashes runtime init" >&2; exit 1; }
      KA_RC=0
      KA_COUNT="$(grep -acF "CAE S3 keepalive" "$LIB")" || KA_RC=$?
      echo "cae gate: keepalive tally matches = ${KA_COUNT:-0} (grep rc=$KA_RC)"
      [ "$KA_RC" -le 1 ] || { echo "ERROR: could not read $LIB (grep exit $KA_RC)" >&2; exit 1; }
      [ "${KA_COUNT:-0}" -ge 1 ] || {
        echo "ERROR: $LIB PREDATES the in-process persistent-connection read path." >&2
        echo "  Rebuild first:  spack install iowarp@dev" >&2
        exit 1; }
      echo "cae link check OK: $LIB (Poco present, no AWS SDK, CAE keepalive tally present)"
    # 1c) #968 INSTRUMENTATION GATE. Revision 2's entire readout is three log
    #     strings emitted by the runtime library. If the installed build predates
    #     them the job runs to completion, prints an all-zero anomaly table, and
    #     means NOTHING -- the most expensive possible failure mode. Assert the
    #     strings are actually in the binary before spending the allocation.
    - |
      CLIO_RUN_BIN="$(command -v clio_run || true)"
      RTLIB="${CLIO_RUN_BIN%/bin/clio_run}/lib/libclio_run_cxx.so"
      [ -f "$RTLIB" ] || RTLIB="${RTLIB%/lib/*}/lib64/libclio_run_cxx.so"
      [ -f "$RTLIB" ] || { echo "ERROR: libclio_run_cxx.so not found under the install root" >&2; exit 1; }
      echo "instrumentation gate: lib -> $(readlink -f "$RTLIB" 2>&1 || true)"
      MISSING=""
      for marker in "PREMATURE RESPONSE" "DUPLICATE RESPONSE" "RESPONSE IDENTITY MISMATCH" "stall threshold ="; do
        if grep -qaF -- "$marker" "$RTLIB"; then
          echo "  present: '$marker'"
        else
          echo "  MISSING: '$marker'" >&2
          MISSING="yes"
        fi
      done
      [ -z "$MISSING" ] || {
        echo "ERROR: the installed runtime PREDATES the #968 revision-2 instrumentation." >&2
        echo "  This job would produce an all-zero anomaly table that means nothing." >&2
        echo "  Rebuild first:  git -C \${CLIO_REPO:-\$HOME/clio-core} pull && spack install iowarp@dev" >&2
        exit 1; }
      echo "instrumentation gate OK: all #968 revision-2 markers present"
    # 1d) Record the build under test. A reproduction attempt that cannot name
    #     the binary it ran against is not evidence.
    - |
      SRC="${CLIO_REPO:-$HOME/clio-core}"
      if [ -d "$SRC/.git" ]; then
        echo "build under test: $(git -C "$SRC" rev-parse --short HEAD 2>/dev/null || echo unknown) \
      on $(git -C "$SRC" rev-parse --abbrev-ref HEAD 2>/dev/null || echo unknown)"
        git -C "$SRC" status --porcelain 2>/dev/null | head -5
      else
        echo "build under test: source tree $SRC not found (cannot record revision)"
      fi
    # 2) AWS credentials. NO SECRETS IN THIS FILE. Credentials live in
    #    ~/.aws/credentials (mode 600). Only non-secret profile and region names
    #    appear here.
    - 'export AWS_PROFILE="${S3_BENCH_PROFILE:-clio-bench}"'
    - 'export AWS_DEFAULT_REGION="${S3_BENCH_REGION:-us-east-1}"'
    # Real AWS: an endpoint override flips addressing to path-style against a
    # nonexistent host, so both must stay unset.
    - 'unset S3_ENDPOINT AWS_ENDPOINT_URL'
    - '[ -r "$HOME/.aws/credentials" ] || { echo "ERROR: ~/.aws/credentials missing/unreadable" >&2; exit 1; }'
    - '[ -n "${S3_BENCH_BUCKET:-}" ] || { echo "ERROR: S3_BENCH_BUCKET not set" >&2; exit 1; }'
    - 'export TMPDIR=/tmp/clio_s3_bench; mkdir -p "$TMPDIR"'
    # 2b) Log headroom. Revision 2 writes FEWER lines than revision 1 (the
    #     per-tick stall spam and no-op rescue lines are deduplicated), but the
    #     guard stays: failing now with a clear message beats dying at row 9.
    - |
      AVAIL_KB="$(df -Pk "$HOME" | awk 'NR==2 {print $4}')"
      echo "free space in \$HOME: $((AVAIL_KB / 1024 / 1024)) GiB"
      [ "$AVAIL_KB" -ge 5242880 ] || {
        echo "ERROR: need >= 5 GiB free in \$HOME for this run's logs; have $((AVAIL_KB / 1024 / 1024)) GiB" >&2
        exit 1; }
    # 3) Stale-state cleanup. pkill patterns are BRACKETED so they never match
    #    this script's own argv.
    - 'pkill -9 -f "[c]himaera" 2>/dev/null || true'
    - 'pkill -9 -f "[c]lio_run" 2>/dev/null || true'
    - '{ command -v fuser >/dev/null 2>&1 && fuser -k 9413/tcp; } >/dev/null 2>&1 || true'
    - 'rm -f /dev/shm/chi_* 2>/dev/null || true'
    - 'rm -rf "$TMPDIR"/cae_s3_* /tmp/iowarp_chi* 2>/dev/null || true'
    # 4) Experiment dirs + repo registration + clean slate (the runner RESUMES
    #    over an existing results.csv and would skip the very rows we want).
    - 'mkdir -p "$HOME/clio_s3_smoke_results" "$HOME/.jarvis-s3-bench"'
    - 'jarvis repo add "${CLIO_REPO:-$HOME/clio-core}/jarvis_clio_core" 2>/dev/null || true'
    - 'rm -f "$HOME/clio_s3_smoke_results/results.csv"'
  post_cmds:
    - 'RES="$HOME/clio_s3_smoke_results/results.csv"; n=$(grep -c success "$RES" 2>/dev/null || true); n=${n:-0}; echo "successful rows: $n / 16"'
    # ---- Row-level verdict -------------------------------------------------
    # Secondary now, not primary: a green row can still contain anomalies, and
    # the anomaly table below is the actual result. A green row with a blank
    # throughput column is still a failure and is asserted here.
    - |
      python3 - "$HOME/clio_s3_smoke_results/results.csv" <<'EOF'
      import csv, os, sys
      from collections import defaultdict
      path = sys.argv[1]
      if not os.path.exists(path):
          print("NO RESULTS CSV AT", path); sys.exit(0)
      rows = list(csv.DictReader(open(path)))
      print("rows:", len(rows))
      need = ["clio_s3.read.agg_bw_mbps"]
      blank = [r.get("run_idx") for r in rows
               if r.get("status") == "success" and any(not r.get(c) for c in need)]
      print("GREEN ROWS WITH BLANK THROUGHPUT (== FAILURES):", blank or "none")
      cell = defaultdict(lambda: [0, 0])
      for r in rows:
          k = (r.get("runtime.stall_threshold_sec"), r.get("clio_s3.object_size"),
               r.get("clio_s3.num_objects"), r.get("clio_s3.concurrency"))
          cell[k][0] += 1
          if r.get("status") != "success":
              cell[k][1] += 1
      print()
      print(f"{'stall_s':>9} {'size':>6} {'nobj':>5} {'K':>3} {'runs':>5} {'fail':>5}")
      for k in sorted(cell, key=lambda x: (str(x[0]), x[1] or '', int(x[3] or 0))):
          v = cell[k]
          print(f"{k[0] or '?':>9} {k[1] or '?':>6} {k[2] or '?':>5} {k[3] or '?':>3} {v[0]:>5} {v[1]:>5}")
      print()
      print("=== failed rows ===")
      for r in rows:
          if r.get("status") != "success":
              print(f"  run={r.get('run_idx')} comb={r.get('combination_idx')} "
                    f"stall_s={r.get('runtime.stall_threshold_sec')} "
                    f"K={r.get('clio_s3.concurrency')} nobj={r.get('clio_s3.num_objects')} "
                    f"size={r.get('clio_s3.object_size')} err={r.get('error')}")
      EOF
    # ---- THE RESULT: per-row anomaly table ---------------------------------
    # Split the combined scheduler log back into per-row segments on the daemon
    # startup line ("[#968] stall threshold = Xs"), then count the #968 event
    # markers in each. This is the A/B readout: the LIVE and INERT arms differ
    # in exactly one setting, so any systematic difference in these columns is
    # attributable to the rescue machinery and nothing else.
    - |
      python3 - "$HOME" "${SLURM_JOB_ID:-unknown}" <<'EOF'
      import glob, os, re, sys
      home, jobid = sys.argv[1], sys.argv[2]
      files = sorted(glob.glob(os.path.join(home, f"clio_s3_smoke-{jobid}.out")) +
                     glob.glob(os.path.join(home, f"clio_s3_smoke-{jobid}.err")))
      if not files:
          print("NO SCHEDULER LOGS FOUND for job", jobid); sys.exit(0)
      # Order matters only within a file; segments are per-daemon-start.
      SPLIT = re.compile(r"\[#968\] stall threshold = ([0-9.eE+-]+)s")
      MARKERS = [
          ("premature",   "PREMATURE RESPONSE"),
          ("duplicate",   "DUPLICATE RESPONSE"),
          ("mismatch",    "RESPONSE IDENTITY MISMATCH"),
          ("parseomni_f", "ParseOmni failed"),
          ("recv_miss",   "[CountClientRecv] miss#"),
          ("stall_epis",  "STALLED on one task"),
          ("rescue",      "[#785] RESCUE:"),
          ("verify_bad",  "Verify:"),
      ]
      segments = []   # (threshold, counts dict, source)
      for path in files:
          cur = None
          with open(path, errors="replace") as fh:
              for line in fh:
                  m = SPLIT.search(line)
                  if m:
                      cur = {"thr": m.group(1), "src": os.path.basename(path)}
                      cur.update({k: 0 for k, _ in MARKERS})
                      segments.append(cur)
                      continue
                  if cur is None:
                      continue
                  for key, pat in MARKERS:
                      if pat in line:
                          cur[key] += 1
      if not segments:
          print("NO '[#968] stall threshold =' LINES FOUND.")
          print("The installed runtime predates revision-2 instrumentation, or")
          print("the daemon never started. This job's anomaly table is void.")
          sys.exit(0)
      hdr = ["seg", "stall_s"] + [k for k, _ in MARKERS]
      w = [4, 9] + [max(len(k), 6) for k, _ in MARKERS]
      print("=== PER-ROW #968 ANOMALY TABLE (one segment = one daemon = one row) ===")
      print(" ".join(h.rjust(x) for h, x in zip(hdr, w)))
      for i, s in enumerate(segments):
          vals = [str(i), s["thr"]] + [str(s[k]) for k, _ in MARKERS]
          print(" ".join(v.rjust(x) for v, x in zip(vals, w)))
      print()
      print("=== ARM TOTALS (the A/B) ===")
      arms = {}
      for s in segments:
          if s["thr"] not in arms:
              arms[s["thr"]] = {k: 0 for k, _ in MARKERS}
              arms[s["thr"]]["rows"] = 0
          a = arms[s["thr"]]
          a["rows"] += 1
          for k, _ in MARKERS:
              a[k] += s[k]
      hdr2 = ["stall_s", "rows"] + [k for k, _ in MARKERS]
      w2 = [9, 5] + [max(len(k), 6) for k, _ in MARKERS]
      print(" ".join(h.rjust(x) for h, x in zip(hdr2, w2)))
      for thr in sorted(arms, key=lambda t: float(t)):
          a = arms[thr]
          vals = [thr, str(a["rows"])] + [str(a[k]) for k, _ in MARKERS]
          print(" ".join(v.rjust(x) for v, x in zip(vals, w2)))
      print()
      tot = sum(a[k] for a in arms.values() for k in ("premature", "duplicate", "mismatch"))
      if tot == 0:
          print("VERDICT: zero response-path anomalies in either arm. The")
          print("premature-completion hypothesis is NOT supported; the failure")
          print("(if any row failed) originates somewhere this instrumentation")
          print("does not watch.")
      else:
          print(f"VERDICT: {tot} response-path anomalies observed. Compare the")
          print("arms above: concentrated in the 1.0s arm implicates the stall")
          print("rescue machinery; present in both exonerates it.")
      EOF
    # ---- Raw evidence extraction -------------------------------------------
    # Pull the handful of lines that matter into ONE SMALL FILE so the run can
    # be read -- and pasted -- without moving gigabytes.
    - |
      SUM="$HOME/clio_s3_smoke_results/evidence-${SLURM_JOB_ID:-unknown}.txt"
      : > "$SUM"
      LOGS=""
      for f in "$HOME"/clio_s3_smoke-${SLURM_JOB_ID:-*}.out "$HOME"/clio_s3_smoke-${SLURM_JOB_ID:-*}.err; do
        [ -f "$f" ] && LOGS="$LOGS $f"
      done
      if [ -z "$LOGS" ]; then
        echo "NO SCHEDULER LOGS FOUND -- looked for \$HOME/clio_s3_smoke-${SLURM_JOB_ID:-*}.{out,err}" | tee -a "$SUM"
      else
        echo "=== evidence extracted from:$LOGS ===" | tee -a "$SUM"
        for f in $LOGS; do
          echo "  $f  ($(wc -l < "$f") lines, $(du -h "$f" | cut -f1))" | tee -a "$SUM"
        done
        # -F throughout: every pattern below is a LITERAL. "[#785]" and
        # "[CountClientRecv]" are bracket expressions to a regex grep and would
        # silently match the wrong thing (or nothing) without it.
        #   [#968]            all three new anomaly markers plus the row-split
        #                     line -- THE headline patterns for revision 2
        #   TOTAL ANOMALIES   the daemon's own periodic anomaly tally
        #   ParseOmni failed  the row failure itself, with all four codes
        #   [CountClientRecv] client-side receive/miss/mismatch tallies
        #   [CountSend]       daemon-side send + anomaly tallies
        #   re-queueing       the ZMQ EAGAIN retry path (was 0 in revision 1)
        #   Verify:           did the bytes land in CTE? Now runs on failed rows
        #   [#785] / [#781]   stall + rescue family, now deduplicated
        for pat in "[#968]" "TOTAL ANOMALIES" "ParseOmni failed" "[CountClientRecv]" \
                   "[CountSend]" "re-queueing" "Verify:" "keepalive TOTAL" \
                   "phase TOTAL" "[#785]" "[#781] worker"; do
          echo "" >> "$SUM"
          echo "----- grep -nF '$pat' -----" >> "$SUM"
          # Cap each pattern so one chatty match cannot bloat the summary.
          grep -nHF -- "$pat" $LOGS 2>/dev/null | head -200 >> "$SUM" || true
          c=$(grep -chF -- "$pat" $LOGS 2>/dev/null | awk '{s+=$1} END {print s+0}')
          echo "  (total matches: ${c:-0})" >> "$SUM"
        done
        echo "" | tee -a "$SUM"
        echo "evidence summary written to: $SUM ($(wc -l < "$SUM") lines)" | tee -a "$SUM"
      fi
    - 'echo "NEXT: paste the PER-ROW #968 ANOMALY TABLE and ARM TOTALS above, plus $HOME/clio_s3_smoke_results/evidence-*.txt"'

config:
  name: clio_s3_smoke

  # MUST stay literally identical to scheduler.hostfile above.
  hostfile: "${HOME}/.jarvis-s3-bench/clio_s3_smoke_hostfile.txt"

  pkgs:
    - pkg_type: jarvis_clio_core.clio_runtime
      pkg_name: runtime
      num_threads: 16          # SWEPT with concurrency
      client_data_segment_size: "4G"
      port: 9413
      # IPC (unix socket), NOT shm: the benchmark is a detached client, not a
      # descendant of the runtime daemon, and Ares compute nodes run
      # ptrace_scope=1, which denies the /proc reopen SHM mode needs.
      #
      # THIS ALSO FIXES THE CODE PATH UNDER TEST. ipc_mode "ipc" means the live
      # client transport is IpcCpu2CpuZmq + IpcManager::RecvZmqClientThread --
      # the SHM twin (IpcCpu2Cpu, DrainShmResponses) is dead code in these jobs.
      # Do not switch this to shm "to compare": that would exercise a different
      # transport and tell us nothing about the failure we are chasing.
      ipc_mode: "ipc"
      # NOT swept, and deliberately not "debug". kDebug is compiled out of a
      # default build (HLOG gates on `if constexpr (LOG_CODE >= CTP_LOG_LEVEL)`
      # and CLIO_CTP_LOG_LEVEL defaults to kInfo), so "debug" here would change
      # nothing; every line this smoke reads is emitted at kInfo or above.
      log_level: "info"
      # THE A/B AXIS -- SWEPT. See point 2 in the header.
      stall_threshold_sec: 1.0
      # Observe-only: a mismatched response is logged and STILL DELIVERED, so
      # this job behaves identically to the runs it is compared against. Flip to
      # true only after mismatches are shown to occur -- that is the fix, and it
      # needs its own controlled run.
      strict_response_identity: false
      # SWIM off: transient errors must not promote a peer to dead mid-run.
      swim_enabled: false
      sleep: 4

    - pkg_type: jarvis_clio_core.clio_cte
      pkg_name: cte_core
      # 24 GB is ~12x the 2 GiB working set, so a row never spills or evicts.
      # Keep it that way: an eviction mid-row would add a second explanation
      # for a failed object and cost us the discrimination.
      devices:
        - ["ram::cte_ram_tier1", "24GB", 1.0]
      dpe_type: "max_bw"
      neighborhood: 1
      pool_query: "local"

    - pkg_type: jarvis_clio_core.clio_s3_bench
      pkg_name: clio_s3
      mode: read
      bucket: "${S3_BENCH_BUCKET}"
      key_prefix: "clio-s3-read-bench/raw/4194304"    # SWEPT
      object_size: "4m"                               # SWEPT
      num_objects: 512                                # SWEPT
      concurrency: 8                                  # SWEPT
      worker_threads: 16                              # SWEPT (reported only)
      tag_prefix: "s3smoke"
      tmpdir: "/tmp/clio_s3_bench"
      aws_region: "${S3_BENCH_REGION}"
      aws_profile: "${S3_BENCH_PROFILE}"
      # Re-reads each tag's size from CTE after the timed run, classifying a
      # failed object as "bytes landed, reply lost" (the response path) vs
      # "bytes missing" (a real assimilation failure). The bench now runs this
      # even when the row already failed -- see point 4 in the header. Costs two
      # CTE round trips per object and no S3 traffic.
      verify: true

vars:
  # --- Configuration axis. ZIPPED, length 8. Granularity AND concurrency are
  #     zipped together into one list rather than crossed, because the product
  #     of the two is mostly rows we already know carry no signal. ORDER IS THE
  #     POINT: the reproduction cell comes first, so an allocation overrun costs
  #     the discriminator, never the reproduction (results.csv is incremental).
  #
  #   idx 0-2  4m / 512  K=1,8,32   the failing cell, block 1
  #   idx 3-5  4m / 512  K=1,8,32   the failing cell, block 2
  #   idx 6    4m / 128  K=32       discriminator: same size, 1/4 the objects
  #   idx 7    512k/4096 K=32       anomaly amplifier: 8x the round trips
  #
  # All three concurrencies are kept even though the failure spans all three:
  # that is exactly why. Concurrency was ruled OUT as the axis by the first 72
  # rows, so dropping it would discard the control that established that.
  #
  # Chunks per object = object_size / 1 MiB (kMaxChunkSize), against a
  # kMaxParallelTasks=32 in-flight window:
  #   4m   ->   4 chunks (NEVER fills; the only cell with 1 < chunks < 32)
  #   512k ->   1 chunk  (single task, no window at all)
  clio_s3.key_prefix: ["clio-s3-read-bench/raw/4194304",
                       "clio-s3-read-bench/raw/4194304",
                       "clio-s3-read-bench/raw/4194304",
                       "clio-s3-read-bench/raw/4194304",
                       "clio-s3-read-bench/raw/4194304",
                       "clio-s3-read-bench/raw/4194304",
                       "clio-s3-read-bench/raw/4194304",
                       "clio-s3-read-bench/raw/524288"]
  clio_s3.object_size:    ["4m", "4m", "4m", "4m", "4m", "4m",  "4m", "512k"]
  # 128 at idx 6 reads obj_000000..obj_000127 out of the 512 staged at this
  # prefix -- a prefix holds exactly 2 GiB / object_size objects, so asking for
  # FEWER is always safe and asking for more is not.
  clio_s3.num_objects:    [512,  512,  512,  512,  512,  512,   128,   4096]
  clio_s3.concurrency:    [1,    8,    32,   1,    8,    32,    32,    32]
  # runtime.num_threads rides along because the S3 assimilator blocks a runtime
  # worker for the whole in-process GET: with too few workers, raising CLIO's
  # concurrency buys nothing. clio_s3.worker_threads mirrors the value into the
  # fairness columns so every row records the confound.
  runtime.num_threads:    [4,    16,   48,   4,    16,   48,    48,    48]
  clio_s3.worker_threads: [4,    16,   48,   4,    16,   48,    48,    48]

  # --- The A/B arm. Length 2, and the INNER loop dimension, so the arms
  #     alternate row by row on otherwise identical configurations.
  #
  #   1.0     LIVE  -- bit-identical to jobs 23925/23930/24154/24155, every one
  #                    of which produced its failures under this value.
  #   3600.0  INERT -- no task can take an hour, so IsStalled() never returns
  #                    true, no rescue ever runs, and the event-queue handover
  #                    never happens. Detection is not "disabled" (a 0 would be
  #                    rejected by the config parser precisely so that nobody
  #                    silently loses the watchdog); it is simply out of reach.
  runtime.stall_threshold_sec: [1.0, 3600.0]

loop:
  # The configuration is the OUTER dimension and the arm the INNER one, so the
  # emitted order is combo 0 = cfg0/LIVE, 1 = cfg0/INERT, 2 = cfg1/LIVE, ...
  # Paired, so a truncated run still yields complete A/B pairs and so that any
  # drift in S3 throughput over the job loads onto both arms equally.
  - [clio_s3.key_prefix, clio_s3.object_size, clio_s3.num_objects,
     clio_s3.concurrency, runtime.num_threads, clio_s3.worker_threads]
  - [runtime.stall_threshold_sec]

# Per-combination wall-clock backstop. Expiry marks the row failed and the run
# continues, so one wedged row cannot cost the other 15.
#
# 1800 is set from measurement: the slowest row here is 4m/512 at K=1 (~384 s
# CLIO-only in the 72-row mean) and 512k/4096 at K=32 (~386 s). That leaves
# ~4.5x headroom, which the INERT arm may need: suppressing rescue also
# suppresses the backlog redistribution that relieves head-of-line blocking, so
# that arm could legitimately run slower. A row that hits this cap is itself a
# finding -- it would mean removing rescue costs liveness -- so do not raise it
# silently to make a red row go away.
run_timeout: 1800

# repeat stays 1 ON PURPOSE. Repetition of the cell under test is expressed in
# the configuration list above, where it can be targeted; repeat: N would
# multiply the discriminator and amplifier rows too.
repeat: 1
output: "${HOME}/clio_s3_smoke_results"
