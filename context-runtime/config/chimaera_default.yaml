# =============================================================================
# IOWarp Default Configuration
# =============================================================================
# Canonical reference for all configurable parameters across:
#   - Chimaera Runtime (context-runtime)
#   - Context Transfer Engine / CTE (context-transfer-engine)
#   - Context Assimilation Engine / CAE (context-assimilation-engine)
#
# Config lookup order (canonical first; legacy paths kept for back-compat):
#   1. $CLIO_SERVER_CONF (or legacy $CHI_SERVER_CONF) environment variable
#   2. ~/.clio/clio.yaml
#   3. ~/.clio/chimaera.yaml
#   4. ~/.chimaera/clio.yaml
#   5. ~/.chimaera/chimaera.yaml         (legacy)
#
# Size values accept: B, KB, MB, GB, TB (case-insensitive)
# =============================================================================

# -- Networking ---------------------------------------------------------------
networking:
  port: 9413                           # RPC listener port
  neighborhood_size: 32                # Max nodes queried when splitting range queries
  # hostfile: "/path/to/hostfile"      # One hostname per line for distributed mode
  wait_for_restart: 30                 # Seconds to wait for peer nodes on startup
  wait_for_restart_poll_period: 1      # Seconds between connection retries

# -- Logging ------------------------------------------------------------------
# Logging is controlled by environment variables, not this file.
#   CTP_LOG_LEVEL : debug, info, success, warning, error, fatal (default: info)
#   CTP_LOG_OUT   : path to a log file (default: console only)

# -- Runtime ------------------------------------------------------------------
runtime:
  num_threads: 4                       # Worker threads for task execution
  queue_depth: 1024                    # Task queue depth per worker
  local_sched: "default"               # Local task scheduler algorithm
  first_busy_wait: 10000               # Microseconds to busy-wait before sleeping (10ms)
  learning_rate: 0.2                   # SGD learning rate for task load prediction model

# -- Compose ------------------------------------------------------------------
# Modules started automatically with the runtime.
#
# Default layout matches the canonical pool-id constants in the source:
# CTE core (clio_cte_core) sits at pool 512.0 — the address every CTE
# client targets via clio::cte::core::kCtePoolId — and CAE
# (clio_cae_core) sits at its own pool 400.0 (clio::cae::core::kCaePoolId)
# with next_pool_id pointing at CTE. CAE is the assimilation / discovery
# entrypoint (CEE -> ParseOmni) and forwards the data path it owns
# (GetOrCreateTag / PutBlob / GetBlob / SemanticSearch) on to CTE.
#
# NOTE: do NOT put CAE in front of CTE at 512.0. CAE only mirrors the
# four data-path method ids above; the rest of its method ids collide
# with CTE's (e.g. CAE kParseOmni == CTE kRegisterTarget == 10), so a
# CTE client hitting CAE for RegisterTarget / TagQuery / BlobQuery is
# dispatched to the wrong handler and crashes. Transparent CTE-client
# interception therefore lives only in the dedicated interceptor test
# configs, never in this default.
#
# Only clio_bdev is strictly required. Drop the CAE or CTE entry if you
# don't need it.
compose:

  # === Block Device (DRAM) ===
  # Required: provides the shared memory allocator used by other modules.
  - mod_name: clio_bdev
    pool_name: "ram::chi_default_bdev"
    pool_query: local
    pool_id: "301.0"
    bdev_type: ram                       # Options: file, ram, hbm, pinned, noop
    capacity: "0g"                       # 0/0g = default to 80% of total system DRAM

  # === Block Device (File) ===
  # Uncomment to add a file-backed block device (e.g., for NVMe or HDD storage).
  # - mod_name: clio_bdev
  #   pool_name: "/mnt/nvme/chi_bdev"
  #   pool_query: local
  #   pool_id: "302.0"
  #   bdev_type: file                    # Options: file, ram, hbm, pinned, noop, s3, gcs
  #   capacity: "100GB"

  # === Block Device (S3 object store) — prototype ===
  # Requires building with -DCLIO_CORE_ENABLE_S3=ON (libcurl + OpenSSL SigV4).
  # pool_name encodes the bucket + key prefix: s3://<bucket>/<prefix>.
  # The endpoint, region, and credentials come from the environment (NOT this
  # file, so no secrets are serialized): S3_ENDPOINT (or AWS_ENDPOINT_URL),
  # AWS_REGION (default us-east-1), AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY.
  # Each allocator block maps to one object keyed by byte offset (s3backer
  # model); capacity is required (the object store has no device size to stat).
  # Example against a local MinIO:
  #   export S3_ENDPOINT=http://127.0.0.1:9000
  #   export AWS_ACCESS_KEY_ID=minioadmin AWS_SECRET_ACCESS_KEY=minioadmin
  # - mod_name: clio_bdev
  #   pool_name: "s3://clio-bdev/pool0"
  #   pool_query: local
  #   pool_id: "303.0"
  #   bdev_type: s3                      # Options: file, ram, hbm, pinned, noop, s3, gcs
  #   capacity: "10GB"

  # === Block Device (Google Cloud Storage) — prototype ===
  # Requires building with -DCLIO_CORE_ENABLE_GCS=ON (libcurl + OpenSSL OAuth2).
  # pool_name encodes the bucket + key prefix: gcs://<bucket>/<prefix>.
  # The endpoint, project, and credentials come from the environment (NOT this
  # file, so no secrets are serialized):
  #   GCS_ENDPOINT     (default https://storage.googleapis.com)
  #   GCS_PROJECT_ID   (default clio-prototype; only used to create the bucket)
  #   Auth, by precedence: GCS_ACCESS_TOKEN (verbatim bearer token), else
  #   GOOGLE_APPLICATION_CREDENTIALS (service-account JSON -> JWT exchange),
  #   else anonymous (for fake-gcs-server / public objects).
  # Uses the GCS JSON API (media upload + alt=media download); same s3backer
  # block->object mapping as kS3. capacity is required.
  # Example against a local fake-gcs-server (anonymous):
  #   export GCS_ENDPOINT=http://127.0.0.1:4443 GCS_PROJECT_ID=clio-prototype
  # - mod_name: clio_bdev
  #   pool_name: "gcs://clio-bdev/pool0"
  #   pool_query: local
  #   pool_id: "304.0"
  #   bdev_type: gcs                     # Options: file, ram, hbm, pinned, noop, s3, gcs
  #   capacity: "10GB"

  # === Block Device (Azure Blob storage) — prototype ===
  # Requires building with -DCLIO_CORE_ENABLE_AZURE=ON (libcurl + OpenSSL
  # Shared Key signing). pool_name encodes the container + key prefix:
  # azure://<container>/<prefix>. The endpoint, account, and access key come
  # from the environment (NOT this file, so no secrets are serialized):
  #   AZURE_BLOB_ENDPOINT   (e.g. http://127.0.0.1:10000 for Azurite, or
  #                          https://<account>.blob.core.windows.net for Azure)
  #   AZURE_STORAGE_ACCOUNT (storage account name; "devstoreaccount1" on Azurite)
  #   AZURE_STORAGE_KEY     (base64 account access key)
  # Addressing style is auto-detected: account-in-host -> virtual-hosted,
  # otherwise account-as-first-path-segment (the Azurite emulator convention).
  # Two backends are provided:
  #   bdev_type: azure       -> Block Blob. One immutable blob per allocator
  #                             block, keyed by byte offset (s3backer model;
  #                             whole-object PUT/GET, like kS3).
  #   bdev_type: azure_page  -> Page Blob. The WHOLE device is one page blob
  #                             written in-place at 512-byte-aligned byte
  #                             offsets (Put Page) — the cloud primitive that
  #                             matches the bdev's flat-device offset model.
  # capacity is required (it sizes the heap allocator and, for page blobs, the
  # page blob's virtual length).
  # Example against a local Azurite (well-known dev account):
  #   export AZURE_BLOB_ENDPOINT=http://127.0.0.1:10000
  #   export AZURE_STORAGE_ACCOUNT=devstoreaccount1
  #   export AZURE_STORAGE_KEY=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==
  # - mod_name: clio_bdev
  #   pool_name: "azure://clio-bdev/pool0"
  #   pool_query: local
  #   pool_id: "305.0"
  #   bdev_type: azure                   # or azure_page (in-place Page Blob)
  #   capacity: "10GB"

  # === Block Device (Alibaba Cloud OSS) — prototype ===
  # Requires building with -DCLIO_CORE_ENABLE_OSS=ON (libcurl + OpenSSL). The
  # genuinely OSS-specific part is the native V1 signer: HMAC-SHA1 over a
  # canonicalized request, "Authorization: OSS <AccessKeyId>:<Signature>", an
  # RFC-1123 Date header, and x-oss-* canonical headers (structurally different
  # from AWS SigV4). pool_name encodes the bucket + key prefix:
  # oss://<bucket>/<prefix>. Endpoint/region/credentials come from the
  # environment (NOT this file, so no secrets are serialized):
  #   OSS_ENDPOINT          (e.g. https://oss-cn-hangzhou.aliyuncs.com, or
  #                          http://127.0.0.1:9000 for a local S3 emulator)
  #   OSS_REGION            (default cn-hangzhou; us-east-1 for MinIO s3-compat)
  #   OSS_ACCESS_KEY_ID     (AccessKeyId; AWS_ACCESS_KEY_ID also accepted)
  #   OSS_ACCESS_KEY_SECRET (AccessKeySecret; AWS_SECRET_ACCESS_KEY accepted)
  #   OSS_SIGNATURE         (v1 = native OSS [default]; s3 = AWS SigV4 for OSS's
  #                          S3-compatible endpoint or an S3 emulator like MinIO)
  # Each allocator block maps to one object keyed by byte offset (s3backer
  # model; whole-object PUT/GET, like kS3); capacity is required.
  # Example against real OSS (native V1 signing):
  #   export OSS_ENDPOINT=https://oss-cn-hangzhou.aliyuncs.com
  #   export OSS_ACCESS_KEY_ID=...  OSS_ACCESS_KEY_SECRET=...
  # - mod_name: clio_bdev
  #   pool_name: "oss://clio-bdev/pool0"
  #   pool_query: local
  #   pool_id: "306.0"
  #   bdev_type: oss
  #   capacity: "10GB"

  # === Context Assimilation Engine (CAE) ===
  # Assimilation / discovery entrypoint at its own pool 400.0
  # (clio::cae::core::kCaePoolId). CEE calls ParseOmni here; CAE forwards
  # the data-path tasks it owns to the CTE core at next_pool_id (512.0).
  - mod_name: clio_cae_core
    pool_name: cae_main
    pool_query: local
    pool_id: "400.0"
    next_pool_id: "512.0"               # CTE core pool — see entry below

    # Transparent LLM labeling — optional. When enabled, PutBlob calls
    # `model` on `label_endpoint` for every blob whose tag+name matches
    # a rule, and stores the response as `{blob_name}_label` in the
    # same tag. Leave commented out for a pure-passthrough CAE.
    #
    # label_endpoint: "http://127.0.0.1:11434"   # Ollama-compatible server
    # label_prompts:
    #   summarize: "Summarize the following text in one short sentence."
    # label_matches:
    #   - tag_re: ".*\\.txt$"                    # only label .txt blobs
    #     blob_re: ".*"
    #     model: "gemma3:1b"
    #     prompt: "summarize"
    #     context_length: 4096                  # tokens (Ollama num_ctx)

  # === Context Transfer Engine (CTE) ===
  # High-performance data buffering and transfer engine. Sits at the
  # canonical CTE entrypoint 512.0 (clio::cte::core::kCtePoolId) so every
  # CTE client / FUSE adapter resolves to it directly. Remove this (and
  # the CAE entry above) if you do not need CTE.
  - mod_name: clio_cte_core
    pool_name: cte_main
    pool_query: local
    pool_id: "512.0"

    # Storage tiers ---------------------------------------------------------
    # Each entry creates a block device for CTE to buffer data onto.
    # score: 0.0 = slowest/cheapest, 1.0 = fastest/most expensive
    #        -1.0 = automatic scoring
    storage:
      - path: "ram::cte_ram_tier1"       # "ram::<name>" for DRAM, filesystem path for disk
        bdev_type: "ram"                 # Options: file, ram, hbm, pinned, noop
        capacity_limit: "0g"             # 0/0g = default to 80% of total system DRAM
        score: 1.0                       # DRAM = highest-performance tier

    # Data Placement Engine ------------------------------------------------
    dpe:
      dpe_type: "max_bw"                # "max_bw", "round_robin", or "random"

    # Target management ----------------------------------------------------
    targets:
      neighborhood: 1                   # Storage nodes CTE can buffer to
      default_target_timeout_ms: 30000   # Timeout for target operations (ms)
      poll_period_ms: 5000               # Target statistics re-scan interval (ms)

    # Performance tuning ---------------------------------------------------
    # Uncomment to override defaults:
    # performance:
    #   stat_targets_period_ms: 50       # Periodic StatTargets interval (ms)
    #   max_concurrent_operations: 64    # Max concurrent I/O operations
    #   score_threshold: 0.7             # Score above which blobs are reorganized
    #   score_difference_threshold: 0.05 # Min score delta to trigger reorganization
    #   flush_metadata_period_ms: 5000   # Metadata flush interval (ms)
    #   flush_data_period_ms: 10000      # Data flush interval (ms)
    #   flush_data_min_persistence: 1    # Min persistence level (1=temp-nonvolatile)
    #   transaction_log_capacity: "32MB" # Write-ahead log capacity
