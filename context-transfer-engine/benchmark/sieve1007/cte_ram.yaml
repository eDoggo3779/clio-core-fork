# Issue #1007 sieve benchmark config: CTE-only (no CAE in this build),
# RAM tier sized for sustained small-write streams.
memory:
  main_segment_size: "8GB"
  client_data_segment_size: "2GB"
  runtime_data_segment_size: "2GB"

runtime:
  num_threads: 4
  queue_depth: 1024
  first_busy_wait: 10000
  max_sleep: 50000

compose:
  - mod_name: clio_cte_core
    pool_name: clio_cte
    pool_query: local
    pool_id: "512.0"

    targets:
      neighborhood: 1
      default_target_timeout_ms: 30000
      poll_period_ms: 5000

    storage:
      - path: "ram::cte1007_ram"
        bdev_type: "ram"
        capacity_limit: "6GB"
        score: 1.0

    dpe:
      dpe_type: "max_bw"
